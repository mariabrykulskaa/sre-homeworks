---
# Source: victoria-metrics-agent/templates/server.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vm-single-victoria-metrics-agent
  namespace: monitoring
  labels: 
    app.kubernetes.io/instance: vm-agent
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: victoria-metrics-agent
    app.kubernetes.io/version: v1.154.0
    helm.sh/chart: victoria-metrics-agent-0.50.0
spec:
  strategy: {}
  replicas: 1
  selector:
    matchLabels: 
      app.kubernetes.io/instance: vm-agent
      app.kubernetes.io/name: victoria-metrics-agent
  template:
    metadata:
      labels: 
        app.kubernetes.io/instance: vm-agent
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: victoria-metrics-agent
      annotations: 
        checksum/config: 835424927a88d99e04cd77191d6a8bea79f066b900a1e186a78e41564ff7cd63
        prometheus.io/path: /metrics
        prometheus.io/port: "8429"
        prometheus.io/scrape: "true"
    spec:
      serviceAccountName: vm-single-victoria-metrics-agent
      automountServiceAccountToken: true
      securityContext: 
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vmagent
          securityContext: 
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          image: victoriametrics/vmagent:v1.154.0
          imagePullPolicy: IfNotPresent
          workingDir: /
          args: 
            - --envflag.enable
            - --envflag.prefix=VM_
            - --httpListenAddr=:8429
            - --loggerFormat=json
            - --promscrape.config=/config/scrape/scrape.yml
            - --remoteWrite.tmpDataPath=/tmpData
            - --remoteWrite.url=http://vm-single-victoria-metrics-single-server.monitoring.svc:8428/api/v1/write
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - name: http
              containerPort: 8429
          readinessProbe: 
            httpGet:
              path: /health
              port: http
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 15
          livenessProbe: 
            initialDelaySeconds: 5
            periodSeconds: 15
            tcpSocket:
              port: http
            timeoutSeconds: 5
          resources: 
            limits:
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - name: tmpdata
              mountPath: /tmpData
            - name: config-out
              mountPath: /config/scrape
            
            
      volumes:
        - name: tmpdata
          emptyDir: 
            {}
        - name: config-out
          configMap:
            name: vm-single-victoria-metrics-agent-config
