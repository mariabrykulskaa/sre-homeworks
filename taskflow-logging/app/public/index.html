<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TaskFlow — трекер задач</title>
  <link rel="preload" href="fonts/manrope-var-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <header class="brand">
        <span class="brand-mark" aria-hidden="true">TF</span>
        <h1>TaskFlow</h1>
      </header>

      <section class="panel" aria-labelledby="projects-heading">
        <div class="panel-head">
          <h2 id="projects-heading">Проекты</h2>
          <button type="button" class="btn btn-small" id="new-project-btn">+ Новый</button>
        </div>
        <ul class="project-list" id="project-list"></ul>
      </section>

      <form class="panel project-form hidden" id="project-form" aria-label="Форма проекта">
        <h3 id="project-form-title">Новый проект</h3>
        <input type="hidden" id="project-form-id">
        <label>
          Название
          <input type="text" id="project-name" maxlength="120" required>
        </label>
        <label>
          Описание
          <textarea id="project-description" rows="2" maxlength="2000"></textarea>
        </label>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Сохранить</button>
          <button type="button" class="btn" id="project-form-cancel">Отмена</button>
        </div>
      </form>
    </aside>

    <main class="content">
      <div class="content-empty" id="empty-state">
        <p>Выберите проект слева или создайте новый,<br>чтобы начать работу с задачами.</p>
      </div>

      <div class="hidden" id="project-view">
        <header class="project-header">
          <div>
            <h2 id="current-project-name"></h2>
            <p class="muted" id="current-project-description"></p>
          </div>
          <div class="project-header-actions">
            <button type="button" class="btn" id="edit-project-btn">Изменить</button>
            <button type="button" class="btn btn-danger" id="delete-project-btn">Удалить</button>
          </div>
        </header>

        <div class="toolbar">
          <div class="filter-group" role="group" aria-label="Фильтр по статусу" id="status-filter">
            <button type="button" class="chip is-active" data-status="" aria-pressed="true">Все</button>
            <button type="button" class="chip" data-status="todo" aria-pressed="false">К работе</button>
            <button type="button" class="chip" data-status="in_progress" aria-pressed="false">В работе</button>
            <button type="button" class="chip" data-status="done" aria-pressed="false">Готово</button>
          </div>
          <button type="button" class="btn btn-primary" id="new-task-btn">+ Задача</button>
        </div>

        <form class="panel task-form hidden" id="task-form" aria-label="Форма задачи">
          <h3 id="task-form-title">Новая задача</h3>
          <input type="hidden" id="task-form-id">
          <label>
            Заголовок
            <input type="text" id="task-title" maxlength="200" required>
          </label>
          <label>
            Описание
            <textarea id="task-description" rows="3" maxlength="5000"></textarea>
          </label>
          <label>
            Статус
            <select id="task-status">
              <option value="todo">К работе</option>
              <option value="in_progress">В работе</option>
              <option value="done">Готово</option>
            </select>
          </label>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary">Сохранить</button>
            <button type="button" class="btn" id="task-form-cancel">Отмена</button>
          </div>
        </form>

        <ul class="task-list" id="task-list"></ul>
        <p class="muted task-list-empty hidden" id="task-list-empty" role="status" aria-live="polite">Задач пока нет.</p>
      </div>
    </main>
  </div>

  <div class="toast hidden" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
