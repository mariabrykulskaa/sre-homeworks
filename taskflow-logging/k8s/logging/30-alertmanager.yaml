# Бонус: Alertmanager — адресат уведомлений vmalert. Без него vmalert не
# запускается с alerting-правилами (нужен -notifier.url), а в его UI видно,
# какие алерты сейчас активны и как они сгруппированы.
#
# Получатель один и «пустой»: уведомления никуда дальше не уходят (в учебном
# кластере нет Slack/почты). Подключить реальный канал — добавить в receivers
# slack_configs / email_configs / webhook_configs.
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: logging
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: taskflow-logging
data:
  alertmanager.yml: |
    route:
      receiver: default
      group_by: [alertname, service]
      group_wait: 10s
      group_interval: 30s
      repeat_interval: 1h
    receivers:
      - name: default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: logging
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: taskflow-logging
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alertmanager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alertmanager
        app.kubernetes.io/part-of: taskflow-logging
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.34.1
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
            - --web.listen-address=:9093
          ports:
            - name: http
              containerPort: 9093
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
              readOnly: true
            # Состояние (silences, журнал уведомлений) — в emptyDir: терять
            # его при пересоздании пода в учебном кластере не жалко.
            - name: storage
              mountPath: /alertmanager
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: alertmanager-config
        - name: storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: logging
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: taskflow-logging
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: alertmanager
  ports:
    - name: http
      port: 9093
      targetPort: http
