# Доступ Vector к API Kubernetes. Источник kubernetes_logs обогащает каждую
# строку метаданными пода (namespace, pod, container, labels) — для этого он
# подписывается (list/watch) на поды своего узла, а также на namespaces и nodes.
# Только чтение; ClusterRole — потому что поды нужны из всех namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vector
  namespace: logging
  labels:
    app.kubernetes.io/name: vector
    app.kubernetes.io/part-of: taskflow-logging
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vector-logs-reader
  labels:
    app.kubernetes.io/name: vector
    app.kubernetes.io/part-of: taskflow-logging
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces", "nodes"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vector-logs-reader
  labels:
    app.kubernetes.io/name: vector
    app.kubernetes.io/part-of: taskflow-logging
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vector-logs-reader
subjects:
  - kind: ServiceAccount
    name: vector
    namespace: logging
