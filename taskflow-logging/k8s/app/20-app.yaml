# Манифесты приложения — те же, что в ДЗ №2, с двумя отличиями:
#   * образ taskflow:2.0 (Python) — приложение с JSON-логами по чек-листу семинара
#     (timestamp, level, message, service.name, …) и request_id;
#   * в ConfigMap добавлен LOG_LEVEL.
# Шиппер логов ничего от приложения не требует: оно по-прежнему пишет только
# в stdout, а kubelet складывает поток в /var/log/pods на узле.
# Приложение TaskFlow: stateless HTTP-сервис (VI фактор), поэтому Deployment —
# реплики взаимозаменяемы, их можно свободно масштабировать и обновлять
# RollingUpdate'ом, не теряя доступности сервиса.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskflow
  namespace: taskflow
  labels:
    app.kubernetes.io/name: taskflow
    app.kubernetes.io/part-of: taskflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: taskflow
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: taskflow
        app.kubernetes.io/part-of: taskflow
    spec:
      securityContext:
        # В образе `USER node` (uid 1000); Kubernetes дополнительно
        # проверяет, что ни один контейнер пода не стартует от root.
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      affinity:
        # В minikube узел один, но в многоузловом кластере планировщик
        # разнесёт реплики по разным узлам (мягкое правило).
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: taskflow
      initContainers:
        # 1. Ждём, пока база примет соединения. Без этого миграция
        #    упала бы с ошибкой подключения и ушла в CrashLoopBackOff
        #    с растущими паузами, что замедляет первый старт.
        - name: wait-for-db
          image: postgres:17-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until pg_isready -h "$DB_HOST" -p "$DB_PORT" -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do
                echo "waiting for postgres at $DB_HOST:$DB_PORT"
                sleep 2
              done
          envFrom:
            - configMapRef:
                name: taskflow-config
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext: &restricted
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
        # 2. Применяем миграции схемы (XII фактор — админ-процесс тем же
        #    образом и с той же конфигурацией, что и приложение). Раннер
        #    идемпотентен и берёт advisory-блокировку в PostgreSQL, поэтому
        #    несколько реплик, стартующих одновременно, не конфликтуют.
        #    Основной контейнер не запустится, пока миграции не применены.
        #    Миграция выполняется при старте каждого пода, в том числе во время
        #    RollingUpdate, когда старые реплики ещё обслуживают трафик, —
        #    поэтому миграции должны быть обратно совместимыми (expand/contract).
        - name: migrate
          image: taskflow:2.0
          imagePullPolicy: Never
          command: ["python", "-m", "taskflow.migrate"]
          envFrom:
            # APP_ENV и LOG_LEVEL — чтобы логи миграций имели тот же
            # deployment.environment и порог, что и у сервера.
            - configMapRef:
                name: taskflow-config
          env: &app-env
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: taskflow-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: taskflow-config
                  key: DB_PORT
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: taskflow-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: taskflow-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: taskflow-db-credentials
                  key: POSTGRES_PASSWORD
            # Строка подключения собирается из частей выше: Kubernetes
            # подставляет $(VAR) для переменных, объявленных раньше в списке.
            # Единый источник правды — ConfigMap и Secret, дублирования нет.
            - name: DATABASE_URL
              value: postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(POSTGRES_DB)
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext: *restricted
      containers:
        - name: taskflow
          image: taskflow:2.0
          # Never: образ собран локально и загружен в minikube; в реестр
          # за ним ходить не нужно (и нельзя — его там нет).
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 3000
          env: *app-env
          envFrom:
            # PORT, APP_ENV, RATE_LIMIT_PER_MINUTE
            - configMapRef:
                name: taskflow-config
          # Liveness: процесс жив (без похода в БД — чтобы при сбое базы
          # не перезапускать здоровые реплики). Readiness: БД доступна;
          # неготовая реплика выводится из балансировки Service.
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/ready
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          # При остановке пода удаление его адреса из Service и SIGTERM
          # происходят параллельно; короткая пауза перед SIGTERM даёт
          # kube-proxy успеть перестать слать на под новые соединения.
          # Затем сервер сам корректно завершает активные запросы.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext: *restricted
---
# Service типа NodePort: единая точка входа, балансирующая соединения между
# всеми готовыми репликами приложения. ClusterIP-часть используется внутри
# кластера, NodePort открывает порт на узле minikube для доступа снаружи.
apiVersion: v1
kind: Service
metadata:
  name: taskflow
  namespace: taskflow
  labels:
    app.kubernetes.io/name: taskflow
    app.kubernetes.io/part-of: taskflow
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: taskflow
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
