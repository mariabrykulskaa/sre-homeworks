# Несекретная конфигурация (III фактор): всё, что меняется между
# окружениями, но не является секретом. Подаётся в контейнеры как
# переменные окружения через envFrom / configMapKeyRef.
apiVersion: v1
kind: ConfigMap
metadata:
  name: taskflow-config
  namespace: taskflow
  labels:
    app.kubernetes.io/part-of: taskflow
data:
  # Приложение
  PORT: "3000"
  NODE_ENV: production
  RATE_LIMIT_PER_MINUTE: "600"
  # Порог логирования: debug | info | warn | error (см. src/lib/logger.js)
  LOG_LEVEL: info
  # База данных: имя Service PostgreSQL (DNS внутри кластера) и порт
  DB_HOST: db
  DB_PORT: "5432"
  POSTGRES_DB: taskflow
  POSTGRES_USER: taskflow
