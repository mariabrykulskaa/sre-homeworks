# Секретная часть конфигурации. Значение здесь — dev-пароль для одноразовой
# базы внутри minikube; в реальном окружении Secret создаётся вне репозитория
# (kubectl create secret / External Secrets / Sealed Secrets) и в git не попадает.
#
# stringData принимает открытый текст; API-сервер сам кодирует его в base64.
apiVersion: v1
kind: Secret
metadata:
  name: taskflow-db-credentials
  namespace: taskflow
  labels:
    app.kubernetes.io/part-of: taskflow
type: Opaque
stringData:
  # Пароль подставляется в DATABASE_URL без экранирования, поэтому не должен
  # содержать символы, требующие URL-кодирования (@ : / ? # и т. п.).
  POSTGRES_PASSWORD: taskflow-dev-password
