# Параметры прокси, который Envoy Gateway разворачивает для Gateway `eg`.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: taskflow-proxy
  namespace: taskflow-deploy
spec:
  provider:
    type: Kubernetes
    kubernetes:
      # В minikube нет балансировщика: Service типа LoadBalancer висел бы в
      # <pending>. ClusterIP + kubectl port-forward (scripts/lib.sh), как в
      # quickstart Envoy Gateway.
      envoyService:
        type: ClusterIP
      envoyDeployment:
        replicas: 1
        container:
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
  # Access-лог Envoy в JSON: на каждый запрос — какой маршрут сработал и какая
  # реплика какой версии ответила (заголовки ответа X-App-Version и
  # X-Served-By от приложения). Это журнал распределения трафика по версиям,
  # который сохраняется в logs/*.envoy.log для каждой стратегии.
  telemetry:
    accessLog:
      settings:
        - format:
            type: JSON
            json:
              start_time: "%START_TIME%"
              method: "%REQ(:METHOD)%"
              path: "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%"
              authority: "%REQ(:AUTHORITY)%"
              user_group: "%REQ(X-USER-GROUP)%"
              request_id: "%REQ(X-REQUEST-ID)%"
              response_code: "%RESPONSE_CODE%"
              response_flags: "%RESPONSE_FLAGS%"
              duration_ms: "%DURATION%"
              route_name: "%ROUTE_NAME%"
              upstream_host: "%UPSTREAM_HOST%"
              app_version: "%RESP(X-APP-VERSION)%"
              served_by: "%RESP(X-SERVED-BY)%"
          sinks:
            - type: File
              file:
                path: /dev/stdout
