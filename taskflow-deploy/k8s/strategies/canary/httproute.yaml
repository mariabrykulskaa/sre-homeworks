# Первый шаг: 10 % запросов — на canary (2.2.0). Следующие шаги меняют только
# weight (scripts/demo-canary.sh); доля = weight / сумма весов правила.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: taskflow
spec:
  parentRefs:
    - name: eg
  hostnames:
    - taskflow.local
  rules:
    - backendRefs:
        - name: taskflow-stable
          port: 80
          weight: 90
        - name: taskflow-canary
          port: 80
          weight: 10
