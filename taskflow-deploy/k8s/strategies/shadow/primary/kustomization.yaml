# Primary — версия 2.1.0, отвечает пользователям.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../app
nameSuffix: -primary
# includeSelectors: метка попадает и в селекторы Deployment/Service, поэтому
# Service taskflow-primary выбирает только поды своей дорожки.
labels:
  - pairs:
      track: primary
    includeSelectors: true
images:
  - name: taskflow
    newTag: "2.1.0"
