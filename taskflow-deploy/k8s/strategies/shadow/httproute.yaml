# Зеркалируются только GET. Обе версии пишут в одну базу, и копия
# POST/PUT/DELETE выполнила бы изменение второй раз: дубль проекта, повторное
# удаление. Изменяющие запросы идут в primary без копии. Чтобы зеркалить и их,
# shadow нужна своя база (или режим «только чтение» / заглушки внешних вызовов).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: taskflow
spec:
  parentRefs:
    - name: eg
  hostnames:
    - taskflow.local
  rules:
    - matches:
        - method: GET
      filters:
        - type: RequestMirror
          requestMirror:
            backendRef:
              name: taskflow-shadow
              port: 80
      backendRefs:
        - name: taskflow-primary
          port: 80
    - backendRefs:
        - name: taskflow-primary
          port: 80
