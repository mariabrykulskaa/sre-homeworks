# Правило с совпадением по заголовку точнее правила без условий, поэтому по
# правилам Gateway API оно проверяется первым, независимо от порядка в списке.
# Значение сравнивается точно (type: Exact), имя заголовка — без учёта регистра.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: taskflow
spec:
  parentRefs:
    - name: eg
  hostnames:
    - taskflow.local
  rules:
    - matches:
        - headers:
            - type: Exact
              name: X-User-Group
              value: beta
      backendRefs:
        - name: taskflow-b
          port: 80
    - backendRefs:
        - name: taskflow-a
          port: 80
