# Dev-пароль одноразовой базы внутри minikube. В реальном окружении Secret
# создаётся вне репозитория (External Secrets / Sealed Secrets).
apiVersion: v1
kind: Secret
metadata:
  name: taskflow-db-credentials
  namespace: taskflow-deploy
  labels:
    app.kubernetes.io/part-of: taskflow
type: Opaque
stringData:
  # Подставляется в DATABASE_URL без экранирования — без символов @ : / ? #.
  POSTGRES_PASSWORD: taskflow-dev-password
